name: visionx
description: Real-time multilingual object detection — EN / FR / EWE
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── Camera ──────────────────────────────────────────────────
  camera: ^0.10.5+9

  # ── Machine Learning (TFLite) ────────────────────────────────
  tflite_flutter: ^0.12.0

  # ── State management ─────────────────────────────────────────
  provider: ^6.1.2

  # ── UI & animations ──────────────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # ── Text-to-Speech ───────────────────────────────────────────
  flutter_tts: ^4.0.2

  # ── Utilities ────────────────────────────────────────────────
  http: ^1.6.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labels/
    - assets/models/
    - assets/images/
